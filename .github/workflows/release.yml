# Builds Windows (x64 and ARM64), Linux, and a universal macOS installer,
# then publishes a single draft GitHub Release
# whenever a `v*` tag is pushed. Publish flow:
#   git tag v0.1.0 && git push origin v0.1.0
# → wait for this workflow → review the draft on the Releases page → publish.
#
# The TAURI_SIGNING_* secrets are for tauri-plugin-updater artifact
# signatures (latest.json + .sig). Until the updater is wired up and the
# secrets are set, they resolve to empty strings and the build simply
# skips updater artifacts.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          # Cross-compiled on the x64 runner: the MSVC ARM64 toolchain ships
          # with Visual Studio there, and NSIS bundles ARM64 fine. yt-dlp has
          # no ARM64 build, but its x64 binary runs under Windows' emulation.
          - name: Windows ARM64
            os: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            rust_targets: "aarch64-pc-windows-msvc"
          - name: macOS Universal
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            libgtk-3-dev
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no passphrase, so the password is the empty
          # string. It is spelled out rather than pulled from a secret
          # because it must be *present* in the environment even when
          # empty: the bundler decides whether to prompt for a password
          # by whether this variable exists. Drop the line and it waits
          # on stdin forever, which hangs the job instead of failing it.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Ad-hoc macOS signature so Apple Silicon can run the build after
          # the user approves it in Privacy & Security. No Developer ID cert
          # yet; when one exists, export the APPLE_* env vars from a guarded
          # $GITHUB_ENV step instead of `${{ secrets.* }}` here — a missing
          # secret still SETS the env var (empty), which sends the bundler
          # down the certificate-import path and fails the build.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "adrify ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          # Every matrix leg would otherwise generate `latest.json` on
          # its own, and the action's download-merge-upload cycle is not
          # atomic: two legs reading before either writes either fail
          # with `already_exists` or silently clobber each other's
          # platform entries, leaving the manifest short of a platform.
          # The `updater-manifest` job below is the only writer.
          #
          # `includeUpdaterJson` is the input name on the v0 branch of
          # the action (`uploadUpdaterJson` only exists on `dev`).
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Renames the installers to names that say which OS they are for, and
  # builds the updater manifest (`latest.json`) from the `.sig` files.
  #
  # Two reasons this is a separate job rather than a tauri-action input:
  #
  #   - The action's manifest upload races across the matrix legs (see
  #     the `uploadUpdaterJson: false` note above). One writer, one
  #     manifest, no contention.
  #   - The installers have to be renamed *after* every leg uploaded,
  #     and the manifest's URLs have to point at the final names. Doing
  #     both in one pass means the release is never seen half-renamed.
  #
  # The minisign signatures cover file contents, not names, so renaming
  # an installer does not invalidate its signature.
  updater-manifest:
    name: Publish the updater manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the signature verifier's dependency
        run: pip install cryptography
      - name: Rename assets and build the updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build-updater-manifest.py \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}"
      - name: Verify the published signature
        # Re-download what was just published and check it the same way
        # the updater will: against the public key baked into
        # src-tauri/tauri.conf.json. A mismatch here means every user
        # would be told the update is corrupt, so the release fails
        # before anyone can install it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify-published-updater.py \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}"

