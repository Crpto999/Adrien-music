# Builds the Windows (x64) installer and publishes a draft GitHub Release
# whenever a `v*` tag is pushed. Publish flow:
#   git tag v0.1.0 && git push origin v0.1.0
# → wait for this workflow → review the draft on the Releases page → publish.
#
# Windows-only: macOS / Linux legs were dropped — the bundle targets in
# tauri.conf.json are ["nsis"] and only Windows is maintained.
#
# The TAURI_SIGNING_* secrets are for tauri-plugin-updater artifact
# signatures (latest.json + .sig). Until the updater is wired up and the
# secrets are set, they resolve to empty strings and the build simply
# skips updater artifacts.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (Windows)
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The passphrase protecting the private key. It is passed through
          # as a secret rather than hardcoded, because the key was
          # generated with one (`tauri signer generate` always asks for
          # a password) and an empty string here would fail to decrypt it.
          #
          # It must be *present* in the environment even when empty: the
          # bundler decides whether to prompt for a password by whether
          # this variable exists. Drop the line and it waits on stdin
          # forever, which hangs the job instead of failing it.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "adrify ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          # The action would otherwise generate `latest.json` on its own.
          # The `updater-manifest` job below is the only writer, so the
          # published manifest always matches the final asset names.
          #
          # `includeUpdaterJson` is the input name on the v0 branch of
          # the action (`uploadUpdaterJson` only exists on `dev`).
          includeUpdaterJson: false

  # Renames the installer to a name that says which OS it is for, and
  # builds the updater manifest (`latest.json`) from the `.sig` file.
  #
  # This is a separate job rather than a tauri-action input so the
  # installer is renamed *before* the manifest's URL is written: doing
  # both in one pass means the release is never seen half-renamed.
  #
  # The minisign signature covers file contents, not names, so renaming
  # an installer does not invalidate its signature.
  updater-manifest:
    name: Publish the updater manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the signature verifier's dependency
        run: pip install cryptography
      - name: Rename assets and build the updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build-updater-manifest.py \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}"
      - name: Verify the published signature
        # Re-download what was just published and check it the same way
        # the updater will: against the public key baked into
        # src-tauri/tauri.conf.json. A mismatch here means every user
        # would be told the update is corrupt, so the release fails
        # before anyone can install it.
        #
        # `--all-platforms` checks every entry in the manifest, not just
        # the one this runner's OS would look up: the runner is Linux,
        # and the shipped build is Windows, so the default would check
        # nothing at all.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify-published-updater.py \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --all-platforms

